<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Makmur | Transaction</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/transaction.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark" aria-label="Makmur"><div class="brand-icon">M</div><strong>MAKMUR</strong></div>
      <nav class="nav-list" aria-label="Main navigation">
        <a class="nav-item" href="/"><span class="nav-icon">▣</span> Product</a>
        <a class="nav-item" href="/invoice.html"><span class="nav-icon">✎</span> Invoice</a>
        <a class="nav-item" href="/payment.html"><span class="nav-icon">▤</span> Payment</a>
        <a class="nav-item active" href="/transaction.html"><span class="nav-icon">≡</span> Transaction</a>
        <a class="nav-item" href="/income.html"><span class="nav-icon">$</span> Income</a>
      </nav>
      <div class="sidebar-footer">LOCAL INVENTORY<br><span>v1.0</span></div>
    </aside>
    <main class="main-content transaction-page">
      <header class="page-header"><div><p class="eyebrow">RECEIVABLES CONTROL</p><h1 id="transactionTitle">Transaction Page</h1></div><div class="header-status"><span class="status-dot"></span> Local database</div></header>
      <section id="transactionListView">
        <nav class="transaction-tabs"><a class="transaction-tab active" href="/transaction.html">Open</a><a class="transaction-tab" href="/transaction.html?history=1">History</a></nav>
        <section class="transaction-toolbar"><label class="search-box"><span aria-hidden="true">⌕</span><input id="transactionSearch" type="search" placeholder="Search..."></label><button class="filter-chip" type="button">Date</button><button class="filter-chip" type="button">Price</button><button class="filter-chip" type="button">Name</button><button class="clock-button" type="button" aria-label="Recent transactions">◷</button></section>
        <section class="table-card transaction-table-card"><div class="table-scroll"><table><thead><tr><th>From</th><th>Date</th><th>D/O</th><th>Cust</th><th>Total Price</th><th>Status</th><th aria-label="Actions"></th></tr></thead><tbody id="transactionRows"><tr><td class="empty-state" colspan="7">Loading transactions...</td></tr></tbody></table></div></section>
      </section>
      <section id="transactionDetailView" hidden>
        <div class="detail-toolbar"><a class="back-link" href="/transaction.html">← Back to transactions</a><button id="downloadTransactionPdf" class="secondary-button" type="button">⤓ Download PDF</button></div>
        <section id="transactionDetail" class="transaction-detail-sheet"><p class="empty-state">Loading detail...</p></section>
      </section>
    </main>
  </div>
  <script src="/app.js?v=9" defer></script>
</body>
</html>
