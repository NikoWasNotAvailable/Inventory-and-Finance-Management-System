<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Barang</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Simplified Navbar: brand + sidebar toggle -->
<nav class="navbar navbar-light bg-white shadow-sm sticky-top">
  <div class="container-fluid">
    <button class="btn btn-outline-secondary me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu"><i class="bi bi-list"></i></button>
    <a class="navbar-brand" href="index.html">TokoKu</a>
  </div>
</nav>

<div class="container-fluid px-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Daftar Barang</h5>
    <div>
      <button id="openInvoice" class="btn btn-outline-primary btn-sm me-2"><i class="bi bi-receipt"></i> Invoice</button>
      <button id="btnAdd" class="btn btn-dark btn-sm me-2"><i class="bi bi-plus-lg me-1"></i>Tambah barang</button>
      <button id="exportInv" class="btn btn-sm btn-outline-secondary me-1">Export Inv CSV</button>
      <button id="importInv" class="btn btn-sm btn-outline-secondary me-1">Import Inv</button>
      <button id="exportSales" class="btn btn-sm btn-outline-secondary">Export Sales CSV</button>
      <input type="file" id="importFile" accept=".csv" style="display:none">
    </div>
  </div>

  <div class="bg-white rounded-3 shadow-sm p-3">
    <!-- category filter -->
    <div class="mb-3">
      <div class="mb-2">
        <input type="search" id="itemsSearch" class="form-control form-control-sm" placeholder="Cari barang...">
      </div>
      <div id="categoryBar" class="btn-group" role="group" aria-label="Categories">
        <button data-cat="all" class="btn btn-outline-secondary btn-sm active">Semua</button>
        <button data-cat="utensils" class="btn btn-outline-secondary btn-sm">Utensils</button>
        <button data-cat="packaging" class="btn btn-outline-secondary btn-sm">Packaging</button>
        <button data-cat="others" class="btn btn-outline-secondary btn-sm">Others</button>
      </div>
    </div>

    <!-- header kolom -->
    <div class="row text-muted small fw-semibold px-2 pb-2 border-bottom">
      <div class="col-2 col-md-1">Qty</div>
      <div class="col-6 col-md-6">Nama barang</div>
      <div class="col-4 col-md-2 price-col">Harga</div>
      <div class="col-12 col-md-3 text-md-end mt-1 mt-md-0">Aksi</div>
    </div>

    <div id="itemsList"></div>

  </div>

  <!-- Offcanvas sidebar -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="sidebarMenuLabel">Menu</h5>
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <!-- search moved above items list on main page -->
    <div class="list-group">
      <a href="index.html" class="list-group-item list-group-item-action">Daftar Barang</a>
      <a href="invoice.html" class="list-group-item list-group-item-action">Invoice</a>
      <a href="history.html" class="list-group-item list-group-item-action">History</a>
      <a href="sales.html" class="list-group-item list-group-item-action">Sales</a>
    </div>
  </div>
</div>
  <!-- Modals -->
  <!-- Add / Edit Item -->
  <div class="modal fade" id="modalItem" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalItemTitle">Tambah Barang</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formItem">
            <input type="hidden" id="itemId">
            <div class="mb-2"><label class="form-label">Nama</label><input id="itemName" class="form-control" required></div>
            <div class="mb-2"><label class="form-label">Kategori</label>
              <select id="itemCategory" class="form-select">
                <option value="utensils">Utensils</option>
                <option value="packaging">Packaging</option>
                <option value="others">Others</option>
              </select>
            </div>
            <div class="mb-2 row">
              <div class="col-6"><label class="form-label">Harga (Rp)</label><input id="itemPrice" type="number" min="0" class="form-control" required></div>
              <div class="col-6"><label class="form-label">Cost (Rp)</label><input id="itemCost" type="number" min="0" class="form-control" value="0"></div>
            </div>
            <div class="mb-2"><label class="form-label">Quantity</label><input id="itemQty" type="number" min="0" class="form-control" value="0"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button id="saveItem" type="button" class="btn btn-primary">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Invoice moved to its own page (invoice.html) -->

  <!-- html2pdf for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="common.js"></script>
  <script src="items.js"></script>
  </body>
</html>
