<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Barang</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
  <div class="container-fluid px-3">

    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbarDark" aria-controls="offcanvasNavbarDark" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <a class="navbar-brand ms-2" href="#">TokoKu</a>

    <!-- nav kategori & search tetap terlihat di layar besar -->
    <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Daftar Barang</h5>
    <div>
      <button id="openInvoice" class="btn btn-outline-primary btn-sm me-2"><i class="bi bi-receipt"></i> Invoice</button>
      <button id="btnAdd" class="btn btn-dark btn-sm me-2"><i class="bi bi-plus-lg me-1"></i>Tambah barang</button>
      <button id="exportInv" class="btn btn-sm btn-outline-secondary me-1">Export Inv CSV</button>
      <button id="importInv" class="btn btn-sm btn-outline-secondary me-1">Import Inv</button>
      <button id="exportSales" class="btn btn-sm btn-outline-secondary">Export Sales CSV</button>
      <input type="file" id="importFile" accept=".csv" style="display:none">
    </div>
  </div>

    <div class="bg-white rounded-3 shadow-sm p-3">

      <!-- header kolom -->
      <div class="row text-muted small fw-semibold px-2 pb-2 border-bottom">
        <div class="col-2 col-md-1">Qty</div>
        <div class="col-6 col-md-6">Nama barang</div>
        <div class="col-4 col-md-2 price-col">Harga</div>
        <div class="col-12 col-md-3 text-md-end mt-1 mt-md-0">Aksi</div>
      </div>

      <div id="itemsList"></div>

    </div>

    <div class="mt-3 d-flex gap-3">
      <div class="card p-3 flex-grow-1">
        <h6>Sales Summary</h6>
        <div id="summary">
          <div>Income: <strong id="income">Rp 0</strong></div>
          <div>Outcome: <strong id="outcome">Rp 0</strong></div>
          <div>Clean Profit: <strong id="profit">Rp 0</strong></div>
        </div>
      </div>
      <div class="card p-3" style="width:320px;">
        <h6>Sales History</h6>
        <div class="small text-muted">Filter by type:</div>
        <select id="historyFilter" class="form-select form-select-sm mb-2">
          <option value="all">Semua</option>
          <option value="customer">Customer</option>
          <option value="resto">Resto</option>
        </select>
        <div id="historyList" class="small"></div>
      </div>
    </div>

  </div>

  <!-- Modals -->
  <!-- Add / Edit Item -->
  <div class="modal fade" id="modalItem" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalItemTitle">Tambah Barang</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formItem">
            <input type="hidden" id="itemId">
            <div class="mb-2"><label class="form-label">Nama</label><input id="itemName" class="form-control" required></div>
            <div class="mb-2"><label class="form-label">Kategori</label>
              <select id="itemCategory" class="form-select">
                <option value="utensils">Utensils</option>
                <option value="packaging">Packaging</option>
                <option value="others">Others</option>
              </select>
            </div>
            <div class="mb-2 row">
              <div class="col-6"><label class="form-label">Harga (Rp)</label><input id="itemPrice" type="number" min="0" class="form-control" required></div>
              <div class="col-6"><label class="form-label">Cost (Rp)</label><input id="itemCost" type="number" min="0" class="form-control" value="0"></div>
            </div>
            <div class="mb-2"><label class="form-label">Quantity</label><input id="itemQty" type="number" min="0" class="form-control" value="0"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button id="saveItem" type="button" class="btn btn-primary">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Invoice Modal -->
  <div class="modal fade" id="modalInvoice" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Invoice Maker</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row mb-2">
            <div class="col-6"><input id="invCustomerName" class="form-control" placeholder="Nama Customer / Resto"></div>
            <div class="col-3"><select id="invCustomerType" class="form-select"><option value="customer">Customer</option><option value="resto">Resto</option></select></div>
            <div class="col-3 text-end"><button id="addLine" class="btn btn-sm btn-outline-primary">Tambah baris</button></div>
          </div>
          <div id="invLines"></div>
          <div class="text-end mt-3">Total: <strong id="invTotal">Rp 0</strong></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button id="finalizeInv" type="button" class="btn btn-success">Simpan & Kurangi Stok</button>
        </div>
      </div>
    </div>
  </div>

  <!-- html2pdf for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>

  </body>
  </html>

<script>
  // contoh interaksi sederhana: tombol + / - mengubah angka qty di badge
  document.querySelectorAll('.item-row').forEach(row => {
    const badge = row.querySelector('.qty-badge');
    const [plusBtn, minusBtn] = row.querySelectorAll('.btn-icon');
    plusBtn.addEventListener('click', () => {
      badge.textContent = parseInt(badge.textContent) + 1;
    });
    minusBtn.addEventListener('click', () => {
      const val = parseInt(badge.textContent);
      if (val > 0) badge.textContent = val - 1;
    });
  });
</script>

</body>
</html>
